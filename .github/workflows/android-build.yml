name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup NDK 27.2.12479018
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27b
          add-to-path: true

      - name: Setup CMake 3.22.1
        uses: jwlawson/actions-setup-cmake@v2
        with:
          version: '3.22.1'

      - name: Grant execute permission for gradlew
        working-directory: ./printready
        run: chmod +x gradlew

      - name: Build with Gradle
        working-directory: ./printready
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: printready-debug-apk
          path: printready/app/build/outputs/apk/debug/app-debug.apk

  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup NDK 27.2.12479018
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27b
          add-to-path: true

      - name: Setup CMake 3.22.1
        uses: jwlawson/actions-setup-cmake@v2
        with:
          version: '3.22.1'

      - name: Grant execute permission for gradlew
        working-directory: ./printready
        run: chmod +x gradlew

      - name: Build Release APK
        working-directory: ./printready
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: printready-release-apk
          path: printready/app/build/outputs/apk/release/app-release-unsigned.apk
