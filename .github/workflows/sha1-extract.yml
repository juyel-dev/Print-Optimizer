name: Extract SHA1

on:
  workflow_dispatch:

jobs:
  sha1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Generate SHA1 fingerprint
        working-directory: ./printready
        run: |
          chmod +x gradlew
          ./gradlew signingReport 2>&1 | tee signing-report.txt
          echo ""
          echo "=========================================="
          echo "DEBUG SHA1:"
          grep -A 4 "Variant: debug" signing-report.txt | grep "SHA1:" | head -1
          echo "=========================================="

      - name: Upload signing report
        uses: actions/upload-artifact@v4
        with:
          name: signing-report
          path: printready/signing-report.txt
