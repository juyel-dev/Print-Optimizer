name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  NDK_VERSION: "27.2.12479018"

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV
          echo "ndk.dir=$ANDROID_HOME/ndk/27.2.12479018" > ./printready/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> ./printready/local.properties

      - name: Install CMake
        run: sdkmanager --install "cmake;3.22.1"

      - name: Grant execute permission for gradlew
        working-directory: ./printready
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: ./printready
        run: ./gradlew assembleDebug --stacktrace --info
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: printready-debug-apk
          path: printready/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV
          echo "ndk.dir=$ANDROID_HOME/ndk/27.2.12479018" > ./printready/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> ./printready/local.properties

      - name: Install CMake
        run: sdkmanager --install "cmake;3.22.1"

      - name: Grant execute permission for gradlew
        working-directory: ./printready
        run: chmod +x gradlew

      - name: Build Release APK (unsigned)
        working-directory: ./printready
        run: ./gradlew assembleRelease --stacktrace --info
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: printready-release-apk
          path: printready/app/build/outputs/apk/release/
          retention-days: 7
