name: Extract SHA1

on:
  workflow_dispatch:

jobs:
  sha1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Create debug keystore (AGP 8.x path)
        run: |
          mkdir -p ~/.config/.android
          mkdir -p ~/.android
          for DIR in ~/.config/.android ~/.android; do
            keytool -genkey -v -keystore $DIR/debug.keystore               -alias androiddebugkey -storepass android -keypass android               -keyalg RSA -keysize 2048 -validity 10000               -dname "CN=Android Debug,O=Android,C=US"
          done
          echo "--- keystores created ---"
          ls -la ~/.config/.android/ ~/.android/

      - name: Generate SHA1 fingerprint
        working-directory: ./printready
        run: |
          chmod +x gradlew
          ./gradlew signingReport 2>&1 | tee signing-report.txt

      - name: Upload signing report
        uses: actions/upload-artifact@v4
        with:
          name: signing-report
          path: printready/signing-report.txt
